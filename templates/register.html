{% extends "base.html" %}
{% block title %}Register — CloudVault{% endblock %}

{% block content %}
<section class="auth-card">
    <h1>Create an account</h1>
    <p class="muted">Register to start using CloudVault.</p>

    <form method="post" action="{{ url_for('auth.register') }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="form-field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username"
                   minlength="3" maxlength="50" required
                   value="{{ request.form.get('username', '') }}">
        </div>

        <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email"
                   maxlength="255" required
                   value="{{ request.form.get('email', '') }}">
        </div>

        <div class="form-field">
            <label for="password">Password</label>
            <div class="password-wrap">
                <input type="password" id="password" name="password"
                       autocomplete="new-password" minlength="8" maxlength="128" required>
                <button type="button" class="toggle-password" data-password-toggle="password"
                        aria-label="Show password">Show</button>
            </div>
        </div>

        <div class="form-field">
            <label for="confirm_password">Confirm password</label>
            <div class="password-wrap">
                <input type="password" id="confirm_password" name="confirm_password"
                       autocomplete="new-password" minlength="8" maxlength="128" required>
                <button type="button" class="toggle-password" data-password-toggle="confirm_password"
                        aria-label="Show password">Show</button>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Register</button>
    </form>

    <p class="auth-alt">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</section>
{% endblock %}
